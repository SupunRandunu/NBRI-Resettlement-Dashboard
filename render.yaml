# Security fix #17: This file contains no sensitive data (no secrets, tokens, or credentials).
# All configuration here is public deployment metadata only.
services:
  - type: web
    name: nbri-resettlement-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
